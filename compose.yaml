services:
  app:
    build: .
    environment:
      GREETING: "${GREETING:-Hello, Docker!}"
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 3s
      timeout: 2s
      retries: 5

volumes:
  redis-data:
